			<text x="16" y="217" style="font-family: SansB; font-size: 10px;fill: rgb(14%,21%,26%); stroke:none;" transform="translate(0,434) scale(1,-1)">Fabrication</text>
			<rect x="112" y="210" width="216.0" height="24" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(7%,49%,50%); fill-rule: evenodd;"/>
			<text x="335.0" y="217" style="font-family: Sans; font-size: 10px;fill: rgb(14%,21%,26%); stroke:none;" transform="translate(0,434) scale(1,-1)">5.184</text>
			<text x="16" y="159" style="font-family: SansB; font-size: 10px;fill: rgb(14%,21%,26%); stroke:none;" transform="translate(0,318) scale(1,-1)">Assembly</text>
			<rect x="112" y="152" width="193.95833333333337" height="24" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(7%,49%,50%); fill-rule: evenodd;"/>
			<text x="312.95833333333337" y="159" style="font-family: Sans; font-size: 10px;fill: rgb(14%,21%,26%); stroke:none;" transform="translate(0,318) scale(1,-1)">4.655</text>
			<text x="16" y="101" style="font-family: SansB; font-size: 10px;fill: rgb(14%,21%,26%); stroke:none;" transform="translate(0,202) scale(1,-1)">Test</text>
