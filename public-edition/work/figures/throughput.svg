<svg width="424" height="275" preserveAspectRatio="xMinYMin meet" viewBox="0 0 424 275" xmlns="http://www.w3.org/2000/svg" version="1.0" fill-rule="evenodd" xmlns:xlink="http://www.w3.org/1999/xlink">
	<title>The slowest useful flow sets the pace</title>
	<desc>Original calculation using the MERIDIAN assumptions in Chapter12. Rates refer to station accepted capacity; line flow is checked sequentially.</desc>
