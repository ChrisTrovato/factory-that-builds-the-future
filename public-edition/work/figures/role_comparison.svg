			<text x="290" y="178.0" style="font-family: Sans; font-size: 9.5px;fill: rgb(14%,21%,26%); stroke:none;" transform="translate(0,356) scale(1,-1)">Models, feedback, logs</text>
			<path d="M 14,117 L 410,117 Z" style="stroke: rgb(91%,93%,92%); stroke-linecap: butt; stroke-width: 1;"/>
			<text x="16" y="136.0" style="font-family: Sans; font-size: 9.5px;fill: rgb(14%,21%,26%); stroke:none;" transform="translate(0,272) scale(1,-1)">Manufacturing</text>
			<text x="147" y="136.0" style="font-family: Sans; font-size: 9.5px;fill: rgb(14%,21%,26%); stroke:none;" transform="translate(0,272) scale(1,-1)">Repeatable quality</text>
			<text x="290" y="136.0" style="font-family: Sans; font-size: 9.5px;fill: rgb(14%,21%,26%); stroke:none;" transform="translate(0,272) scale(1,-1)">Tools, process, yield</text>
			<path d="M 14,75 L 410,75 Z" style="stroke: rgb(91%,93%,92%); stroke-linecap: butt; stroke-width: 1;"/>
