<svg width="424" height="285" preserveAspectRatio="xMinYMin meet" viewBox="0 0 424 285" xmlns="http://www.w3.org/2000/svg" version="1.0" fill-rule="evenodd" xmlns:xlink="http://www.w3.org/1999/xlink">
	<title>Different roles, shared physical systems</title>
	<desc>Illustrative role comparison. Read current job responsibilities, not only the degree title.</desc>
