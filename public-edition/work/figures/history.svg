<svg width="424" height="275" preserveAspectRatio="xMinYMin meet" viewBox="0 0 424 275" xmlns="http://www.w3.org/2000/svg" version="1.0" fill-rule="evenodd" xmlns:xlink="http://www.w3.org/1999/xlink">
	<title>The accumulated ability to repeat</title>
	<desc>Conceptual historical sequence, not a claim that one technique replaced every earlier technique.</desc>
	<clipPath id="clip-history">
		<rect x="0" y="0" width="424" height="275"/>
	</clipPath>
	<g id="group-history" transform="scale(1,-1) translate(0,-275)" style="clip-path: url(#clip-history)">
		<g transform="">
			<rect x="0" y="0" width="424" height="275" rx="5" ry="5" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(96%,95%,93%); fill-rule: evenodd;"/>
			<path d="M 46,32 L 46,244 Z" style="stroke: rgb(7%,49%,50%); stroke-linecap: butt; stroke-width: 2;"/>
			<circle cx="46" cy="245" r="10" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(7%,49%,50%); fill-rule: evenodd;"/>
			<text x="43.71923828125" y="242" style="font-family: SansB; font-size: 9px;fill: rgb(100%,100%,100%); stroke:none;" transform="translate(0,484) scale(1,-1)">1</text>
			<text x="67" y="247" style="font-family: SansB; font-size: 10.5px;fill: rgb(7%,49%,50%); stroke:none;" transform="translate(0,494) scale(1,-1)">Reference surfaces</text>
			<text x="67" y="232" style="font-family: Sans; font-size: 9px;fill: rgb(40%,46%,50%); stroke:none;" transform="translate(0,464) scale(1,-1)">Make a stable geometric starting point.</text>
			<circle cx="46" cy="205" r="10" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(7%,49%,50%); fill-rule: evenodd;"/>
			<text x="43.71923828125" y="202" style="font-family: SansB; font-size: 9px;fill: rgb(100%,100%,100%); stroke:none;" transform="translate(0,404) scale(1,-1)">2</text>
			<text x="67" y="207" style="font-family: SansB; font-size: 10.5px;fill: rgb(7%,49%,50%); stroke:none;" transform="translate(0,414) scale(1,-1)">Interchangeability</text>
			<text x="67" y="192" style="font-family: Sans; font-size: 9px;fill: rgb(40%,46%,50%); stroke:none;" transform="translate(0,384) scale(1,-1)">Parts fit without individual hand adjustment.</text>
			<circle cx="46" cy="165" r="10" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(7%,49%,50%); fill-rule: evenodd;"/>
			<text x="43.71923828125" y="162" style="font-family: SansB; font-size: 9px;fill: rgb(100%,100%,100%); stroke:none;" transform="translate(0,324) scale(1,-1)">3</text>
			<text x="67" y="167" style="font-family: SansB; font-size: 10.5px;fill: rgb(7%,49%,50%); stroke:none;" transform="translate(0,334) scale(1,-1)">Machine tools + power</text>
			<text x="67" y="152" style="font-family: Sans; font-size: 9px;fill: rgb(40%,46%,50%); stroke:none;" transform="translate(0,304) scale(1,-1)">Repeat controlled transformations.</text>
			<circle cx="46" cy="125" r="10" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(7%,49%,50%); fill-rule: evenodd;"/>
			<text x="43.71923828125" y="122" style="font-family: SansB; font-size: 9px;fill: rgb(100%,100%,100%); stroke:none;" transform="translate(0,244) scale(1,-1)">4</text>
			<text x="67" y="127" style="font-family: SansB; font-size: 10.5px;fill: rgb(7%,49%,50%); stroke:none;" transform="translate(0,254) scale(1,-1)">Numerical control + CAD</text>
			<text x="67" y="112" style="font-family: Sans; font-size: 9px;fill: rgb(40%,46%,50%); stroke:none;" transform="translate(0,224) scale(1,-1)">Express geometry and process in data.</text>
			<circle cx="46" cy="85" r="10" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(7%,49%,50%); fill-rule: evenodd;"/>
			<text x="43.71923828125" y="82" style="font-family: SansB; font-size: 9px;fill: rgb(100%,100%,100%); stroke:none;" transform="translate(0,164) scale(1,-1)">5</text>
			<text x="67" y="87" style="font-family: SansB; font-size: 10.5px;fill: rgb(7%,49%,50%); stroke:none;" transform="translate(0,174) scale(1,-1)">Robotics + metrology</text>
			<text x="67" y="72" style="font-family: Sans; font-size: 9px;fill: rgb(40%,46%,50%); stroke:none;" transform="translate(0,144) scale(1,-1)">Execute and verify more complex tasks.</text>
			<circle cx="46" cy="45" r="10" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(7%,49%,50%); fill-rule: evenodd;"/>
			<text x="43.71923828125" y="42" style="font-family: SansB; font-size: 9px;fill: rgb(100%,100%,100%); stroke:none;" transform="translate(0,84) scale(1,-1)">6</text>
			<text x="67" y="47" style="font-family: SansB; font-size: 10.5px;fill: rgb(7%,49%,50%); stroke:none;" transform="translate(0,94) scale(1,-1)">Connected evidence</text>
			<text x="67" y="32" style="font-family: Sans; font-size: 9px;fill: rgb(40%,46%,50%); stroke:none;" transform="translate(0,64) scale(1,-1)">Preserve what was made and why it passed.</text>
		</g>
	</g>
</svg>
